# SonarCloud analysis for both long-lived lines of development:
#   - main (legacy WinForms / SrvSurvey.sln)
#   - SrvSurvey-Avalonia (XP / SrvSurvey.slnx)
#
# PR events are limited to those two bases so feature-branch noise stays low,
# while each codebase still builds with the right SDK and solution layout.
name: SonarQube analysis

on:
  push:
    branches:
      - main
      - SrvSurvey-Avalonia
  pull_request:
    branches:
      - main
      - SrvSurvey-Avalonia
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  # Needed so the scanner can read PR metadata for SonarCloud PR decoration.
  pull-requests: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SONAR_SCANNER_VERSION: "11.2.1" # Bump this value to invalidate the scanner cache.
  SONAR_PROJECT_KEY: "Fenris159_SrvSurvey"
  SONAR_ORGANIZATION: "fenris159"

jobs:
  analyze:
    name: Build and analyze
    # Skip fork PRs (no access to SONAR_TOKEN secrets on pull_request from forks).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect solution layout
        id: layout
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "SrvSurvey.slnx") {
            "kind=avalonia" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "project=SrvSurvey.slnx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "has_tests=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Detected Avalonia / XP layout (SrvSurvey.slnx)"
          }
          elseif (Test-Path -LiteralPath "SrvSurvey/SrvSurvey.csproj") {
            # Build the app project only — the .sln also pulls in the WAP packaging project.
            "kind=winforms" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "project=SrvSurvey/SrvSurvey.csproj" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "has_tests=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Detected WinForms / main layout (SrvSurvey/SrvSurvey.csproj)"
          }
          else {
            throw "Could not detect SrvSurvey.slnx or SrvSurvey/SrvSurvey.csproj"
          }

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Install both so the same workflow works on main (net9) and Avalonia (net10).
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Install Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\sonar-scanner
          key: ${{ runner.os }}-sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path "${{ runner.temp }}\sonar-scanner" -ItemType Directory -Force | Out-Null
          dotnet tool install dotnet-sonarscanner --tool-path "${{ runner.temp }}\sonar-scanner" --version "$env:SONAR_SCANNER_VERSION"

      - name: Begin SonarQube analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          BRANCH_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $scanner = Join-Path "${{ runner.temp }}\sonar-scanner" "dotnet-sonarscanner.exe"
          if (-not (Test-Path -LiteralPath $scanner)) {
            $scanner = Join-Path "${{ runner.temp }}\sonar-scanner" "dotnet-sonarscanner"
          }

          $args = @(
            "begin",
            "/k:$env:SONAR_PROJECT_KEY",
            "/o:$env:SONAR_ORGANIZATION",
            '/d:sonar.host.url=https://sonarcloud.io',
            '/d:sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml',
            '/d:sonar.coverage.exclusions=SrvSurvey.Desktop/**/*.axaml,src/SrvSurvey.Desktop/**/*.axaml,SrvSurvey.Desktop/**/*.axaml.cs,src/SrvSurvey.Desktop/**/*.axaml.cs,SrvSurvey.Desktop/Platform/Overlay/*Coordinator.cs,src/SrvSurvey.Desktop/Platform/Overlay/*Coordinator.cs,SrvSurvey/**/*.Designer.cs',
            "/d:sonar.token=$env:SONAR_TOKEN"
          )

          # Explicit PR / branch metadata so SonarCloud decorates the right GitHub PR
          # even when CI auto-detection is incomplete.
          if ($env:EVENT_NAME -eq "pull_request") {
            $args += "/d:sonar.pullrequest.key=$env:PR_NUMBER"
            $args += "/d:sonar.pullrequest.branch=$env:PR_HEAD_REF"
            $args += "/d:sonar.pullrequest.base=$env:PR_BASE_REF"
            Write-Host "Sonar PR analysis: key=$env:PR_NUMBER branch=$env:PR_HEAD_REF base=$env:PR_BASE_REF"
          }
          else {
            $args += "/d:sonar.branch.name=$env:BRANCH_NAME"
            Write-Host "Sonar branch analysis: $env:BRANCH_NAME"
          }

          & $scanner @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore "${{ steps.layout.outputs.project }}"

      - name: Build (Avalonia / XP)
        if: steps.layout.outputs.kind == 'avalonia'
        run: dotnet build SrvSurvey.slnx --configuration Release --no-restore

      - name: Build (WinForms / main)
        if: steps.layout.outputs.kind == 'winforms'
        run: >-
          dotnet build SrvSurvey/SrvSurvey.csproj
          --configuration Release
          --no-restore
          -p:Platform=x64

      - name: Test with coverage (Avalonia / XP)
        if: steps.layout.outputs.kind == 'avalonia'
        run: >-
          dotnet test SrvSurvey.slnx
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Skip tests (WinForms / main has no test projects)
        if: steps.layout.outputs.kind == 'winforms'
        shell: pwsh
        run: Write-Host "No test projects in the WinForms layout; analyzing build only."

      - name: Complete SonarQube analysis
        if: success()
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $scanner = Join-Path "${{ runner.temp }}\sonar-scanner" "dotnet-sonarscanner.exe"
          if (-not (Test-Path -LiteralPath $scanner)) {
            $scanner = Join-Path "${{ runner.temp }}\sonar-scanner" "dotnet-sonarscanner"
          }
          & $scanner end "/d:sonar.token=$env:SONAR_TOKEN"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
